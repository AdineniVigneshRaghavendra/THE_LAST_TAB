<!DOCTYPE html>
<html lang="en">
    <head>

        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width,  initial-scale=1.0">

        <title>THE LAST TAB</title>

        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <div class="screen">
            <div class="terminal">

                <p class="system">SYSTEM CONNECTION</p>

                <h1>THE LAST TAB</h1>

                <p>------------------------------------------</p>

                <p>CONNECTION: <span class="active">ACTIVE</span></p>

                <p>USER: <span class="glitch">UNKNOWN</span></p>

                <p>SESSION: 00:00:01</p>
                <p>LAST USER: <span class="censored">UNKNOWN</span></p>

                <br>

                <p>LAST ACTIVITY:</p>

                <p class="warning">17 DAYS AGO</p>
                <br>
                <p>STATUS:</p>
                <p class=""warning>STILL HERE</p>
                <br><br>

                <button id="enterButton">
                    [ ENTER ARCHIVE ]
                </button>
                <p class="bottom-text">
                    DO NOT CLOSE THIS TAB
                </p>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
